name: CI

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      languagetool:
        image: erikvl87/languagetool:6.6
        ports:
          - 8010:8010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Install Vale
        run: |
          curl -sSL https://github.com/errata-ai/vale/releases/download/v3.24.0/vale_3.24.0_Linux_64-bit.tar.gz \
            | tar -xz -C /usr/local/bin vale
      - name: Install textstat
        run: pip install -r scripts/copy-check/requirements.txt
      - name: Wait for LanguageTool
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8010/v2/languages >/dev/null && exit 0
            sleep 2
          done
          echo "LanguageTool did not start" >&2
          exit 1
      - name: Copy checks
        run: npm run copy:check
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright and axe
        run: npm run test:e2e
      - name: Chrome path for Lighthouse
        id: chrome
        run: echo "path=$(node -p "require('@playwright/test').chromium.executablePath()")" >> "$GITHUB_OUTPUT"
      - name: Lighthouse mobile and desktop
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
        run: npm run lhci
