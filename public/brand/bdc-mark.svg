<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" role="img" aria-labelledby="title">
  <title id="title">BDC — Belgian Drone Cleaning</title>
  <!--
    Based on user-supplied mark: bold connected BDC + cleaning drone.
    Improvements: drone skids fuse into letter tops; cyan spray accent;
    tighter silhouette that still reads at small sizes.
  -->
  <g fill="#0B1F3A">
    <!-- B (with left stem notch) -->
    <path d="M28 48h52c22 0 38 12 38 32 0 12-6 22-16 28 14 6 24 18 24 34 0 24-18 38-44 38H28V48zm36 52h14c8 0 14-5 14-12s-6-12-14-12H64v24zm0 58h18c10 0 16-6 16-14s-6-14-16-14H64v28z"/>
    <!-- notch cut -->
    <rect x="28" y="78" width="18" height="14" fill="#fff"/>
    <!-- D connected at base to B -->
    <path fill-rule="evenodd" d="M118 48h40c48 0 82 32 82 72s-34 72-82 72h-40V48zm36 28v88h8c28 0 48-20 48-44s-20-44-48-44h-8z"/>
    <!-- C -->
    <path d="M268 72c-6-14-22-26-46-26-40 0-68 30-68 74s28 74 68 74c24 0 40-12 46-26l-30-12c-4 6-10 10-18 10-18 0-30-14-30-46s12-46 30-46c8 0 14 4 18 10l30-12z"/>
    <!-- base bridge B–D -->
    <rect x="100" y="172" width="40" height="0" opacity="0"/>
  </g>

  <!-- Drone fused onto B/D crown -->
  <g fill="#0B1F3A">
    <!-- body -->
    <ellipse cx="128" cy="34" rx="18" ry="10"/>
    <rect x="116" y="28" width="24" height="12" rx="4"/>
    <!-- arms -->
    <path d="M100 30 L88 18 M156 30 L168 18 M104 40 L92 52 M152 40 L164 52" stroke="#0B1F3A" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- rotors -->
    <ellipse cx="86" cy="16" rx="14" ry="3"/>
    <ellipse cx="170" cy="16" rx="14" ry="3"/>
    <ellipse cx="90" cy="54" rx="11" ry="2.5"/>
    <ellipse cx="166" cy="54" rx="11" ry="2.5"/>
    <circle cx="86" cy="16" r="2.5"/>
    <circle cx="170" cy="16" r="2.5"/>
    <circle cx="90" cy="54" r="2"/>
    <circle cx="166" cy="54" r="2"/>
    <!-- skids fused into letter tops -->
    <path d="M112 42 L108 52 M144 42 L148 52" stroke="#0B1F3A" stroke-width="3" stroke-linecap="round"/>
    <path d="M102 52 H120 M136 52 H154" stroke="#0B1F3A" stroke-width="3.5" stroke-linecap="round"/>
    <!-- nozzle -->
    <rect x="124" y="40" width="8" height="10" rx="2"/>
  </g>
  <!-- cyan cleaning spray (brand accent) -->
  <g stroke="#00C2E8" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M128 52 L120 66"/>
    <path d="M128 52 L128 68"/>
    <path d="M128 52 L136 66"/>
  </g>
  <circle cx="128" cy="50" r="2.5" fill="#00C2E8"/>
</svg>
